[package]
name = "pairdrop-pairing"
description = "PairDrop device pairing and secret storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pairdrop-proto = { path = "../pairdrop-proto" }
serde.workspace = true
serde_json.workspace = true

# The default `v1` feature already picks the right backend per platform: Apple Keychain
# on macOS, Secret Service over zbus on Linux. No OpenSSL, nothing to configure.
keyring = "4"
thiserror = "2.0.20"
