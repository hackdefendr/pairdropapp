<?xml version="1.0" encoding="UTF-8"?>
<!-- The same paper plane as the macOS client, so the two read as one app.
     Deliberately not an SF Symbol: Apple's licence does not permit them in app icons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- Upper wing, then the darker lower fold, as in the macOS artwork. -->
  <path d="M28 62 L96 32 L58 70 Z" fill="#ffffff"/>
  <path d="M58 70 L96 32 L68 96 Z" fill="#ffffff" fill-opacity="0.72"/>
</svg>
