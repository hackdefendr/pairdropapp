[package]
name = "pairdrop-transfer"
description = "PairDrop transfer state machine: request, headers, chunking, partition handshake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
pairdrop-proto = { path = "../pairdrop-proto" }
serde_json.workspace = true
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
async-trait = "0.1.92"
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
