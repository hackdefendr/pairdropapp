[package]
name = "pairdrop-net"
description = "Signaling transport for PairDrop: WebSocket connection, keepalive, reconnect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = "0.3.34"
pairdrop-proto = { path = "../pairdrop-proto" }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "http2", "charset"] }
rustls = "0.23.43"
rustls-pki-types = "1.15.1"
serde_json.workspace = true
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
url.workspace = true
webpki-roots = "1.0.9"
