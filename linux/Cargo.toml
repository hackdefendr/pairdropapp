[workspace]
resolver = "2"
members = [
    "crates/pairdrop-proto",
    "crates/pairdrop-net",
    "crates/pairdrop-rtc",
    "crates/pairdrop-transfer",
    "crates/pairdrop-pairing",
    "crates/pairdrop-client",
    "crates/pairdrop-gtk",
    "crates/pairdrop-cli",
]

# The GUI needs GTK 4 and libadwaita headers, which the macOS machine this is developed
# on doesn't have — so a bare `cargo test` skips it and everything else still builds
# anywhere. Build the app explicitly with `-p pairdrop-gtk`, or via ./install.sh.
default-members = [
    "crates/pairdrop-proto",
    "crates/pairdrop-net",
    "crates/pairdrop-rtc",
    "crates/pairdrop-transfer",
    "crates/pairdrop-pairing",
    "crates/pairdrop-client",
    "crates/pairdrop-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Forced up by webrtc 0.20, which is edition 2024. That rules out Ubuntu 24.04's
# packaged rustc, so distro builds need the toolchain from rustup or a backport.
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/hackdefendr/pairdropapp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

[profile.release]
lto = "thin"
strip = true
