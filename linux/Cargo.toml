[workspace]
resolver = "2"
members = ["crates/pairdrop-proto"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Ubuntu 24.04 LTS and Debian 13 ship older toolchains than rustup does; keeping the
# floor low means the app builds from distro packages, not just from rustup.
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/hackdefendr/pairdropapp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

[profile.release]
lto = "thin"
strip = true
